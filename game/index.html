<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — an open-world crime story in nine jobs</title>
<meta name="description" content="Solmar: a sun-soaked 2D open-world crime game. Steal cars, outrun the cops, fight the Breakers and run nine story jobs to take the city.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f4f1e6; font: 18px/1.5 "Trebuchet MS", sans-serif; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar: an open-world crime game. Drive with W A S D, enter a car with E, punch with F, honk with H, aim with the mouse and shoot with a click"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p id="noscript">Solmar needs JavaScript to run — please enable it and reload the page.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
