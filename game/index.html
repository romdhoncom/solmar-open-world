<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — a 3D open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e1a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #game-canvas { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { position: absolute; background: rgba(10, 14, 26, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 10px 12px; }
  .mission-box { top: 12px; left: 12px; max-width: 340px; }
  .mission-name { font-weight: 800; font-size: 17px; color: #ffd24a; }
  .mission-obj { font-size: 14px; margin-top: 4px; line-height: 1.35; }
  .mission-hint { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .mission-timer { font-size: 15px; font-weight: 700; color: #ff8844; margin-top: 4px; }
  .top-right { top: 12px; right: 12px; text-align: right; }
  .clock { font-size: 20px; font-weight: 800; }
  .money { font-size: 18px; font-weight: 700; color: #7dd87d; }
  .stars { font-size: 20px; letter-spacing: 2px; }
  .right-panel { top: 110px; right: 12px; width: 170px; }
  .rank-title { font-weight: 800; color: #ffd24a; }
  .bar { height: 10px; background: rgba(255,255,255,0.18); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .bar .fill { height: 100%; background: #ffd24a; width: 0%; }
  .rank-pts { font-size: 12px; opacity: 0.8; margin-top: 3px; }
  .weapons { margin-top: 10px; }
  .weapon { font-size: 13px; padding: 3px 6px; border-radius: 4px; opacity: 0.65; }
  .weapon.active { background: rgba(255, 210, 74, 0.25); opacity: 1; font-weight: 700; }
  .bottom-left { bottom: 12px; left: 12px; }
  .location { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .minimap { display: block; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; }
  .health-bar { margin-top: 8px; }
  .health-bar .fill { background: #e84a4a; width: 100%; }
  .armour-bar .fill { background: #66aaff; width: 0%; }
  .act-title { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); font-size: 34px; font-weight: 900; letter-spacing: 2px; color: #ffd24a; text-shadow: 0 2px 12px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.5s; text-align: center; }
  .banner { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.4s; text-align: center; white-space: nowrap; }
  .banner-sub { position: absolute; left: 50%; top: calc(18% + 42px); transform: translateX(-50%); font-size: 16px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.4s; text-align: center; }
  .crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 4px #000; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 10, 20, 0.82); z-index: 10; text-align: center; padding: 20px; }
  .game-title { font-size: 64px; font-weight: 900; letter-spacing: 8px; color: #ffd24a; margin: 0; text-shadow: 0 4px 24px rgba(255, 154, 60, 0.5); }
  .tagline { font-size: 18px; opacity: 0.9; margin: 12px 0 20px; }
  .controls-list { font-size: 14px; line-height: 1.7; max-width: 640px; opacity: 0.85; }
  .save-note { font-size: 13px; opacity: 0.65; margin-top: 14px; }
  .start-btn, .resume-btn, .save-btn { pointer-events: auto; margin-top: 22px; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 12px 42px; border: none; border-radius: 8px; background: #ffd24a; color: #1a1a1a; cursor: pointer; }
  .start-btn:hover, .resume-btn:hover, .save-btn:hover { background: #ffe08a; }
  .pause-menu { align-items: stretch; justify-content: flex-start; padding-top: 40px; }
  .pause-menu h2 { font-size: 34px; letter-spacing: 4px; margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; justify-content: center; }
  .tab { pointer-events: auto; font-size: 15px; font-weight: 700; padding: 8px 18px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; cursor: pointer; }
  .tab.active { background: #ffd24a; color: #1a1a1a; border-color: #ffd24a; }
  .tab-panel { margin-top: 16px; }
  .fullmap { border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; max-width: 92vw; max-height: 62vh; }
  .map-legend { font-size: 13px; opacity: 0.8; margin-top: 8px; }
  .mission-list { max-width: 640px; margin: 0 auto; text-align: left; font-size: 15px; line-height: 2; }
  .mission-row { padding: 2px 8px; }
  .save-btn, .resume-btn { font-size: 16px; padding: 10px 28px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="status" aria-live="polite" class="sr-only"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
