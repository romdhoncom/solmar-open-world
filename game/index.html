<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar — a 3D open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a22; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game-canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .panel { position: absolute; background: rgba(10, 14, 20, 0.72); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(2px); }
  #mission-box { top: 14px; left: 14px; max-width: 340px; }
  #mission-name { font-weight: 700; font-size: 17px; color: #ffd24a; }
  #mission-obj { font-size: 13px; color: #e8e8e8; margin-top: 2px; }
  #mission-timer { font-size: 15px; color: #ff8a6a; font-weight: 700; margin-top: 2px; }
  #stats { top: 14px; right: 14px; text-align: right; }
  #clock { font-size: 20px; font-weight: 700; }
  #money { font-size: 18px; color: #7ee787; font-weight: 700; }
  #stars { font-size: 20px; color: #ff4444; letter-spacing: 2px; }
  #stars .dim { color: rgba(255, 255, 255, 0.25); }
  #rank-box { top: 118px; right: 14px; width: 210px; }
  #rank-title { font-size: 14px; font-weight: 700; color: #ffd24a; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: #ffd24a; width: 0%; }
  .bar.hp > div { background: #ff4444; }
  .bar.ar > div { background: #4a9aff; }
  #weapons { margin-top: 8px; font-size: 12px; line-height: 1.6; color: #cfcfcf; }
  #weapons .sel { color: #fff; font-weight: 700; background: rgba(255, 210, 74, 0.25); border-radius: 4px; padding: 0 4px; }
  #loc-box { bottom: 14px; left: 14px; }
  #location { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  #minimap { display: block; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 6px; }
  #loc-box .bar { margin-top: 6px; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; font-size: 22px; line-height: 22px; text-align: center; color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 4px #000; pointer-events: none; }
  #banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.3s; }
  #banner.show { opacity: 1; }
  #banner strong { display: block; font-size: 38px; letter-spacing: 3px; text-shadow: 0 2px 12px #000; }
  #banner span { font-size: 16px; text-shadow: 0 1px 6px #000; }
  #act-title { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); font-size: 26px; letter-spacing: 4px; opacity: 0; transition: opacity 0.6s; text-shadow: 0 2px 10px #000; }
  #act-title.show { opacity: 1; }
  #toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(10, 14, 20, 0.8); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
  #start-screen, #pause-menu, #complete-screen, #dead-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 10, 18, 0.55); pointer-events: auto; text-align: center; }
  #start-screen h1, #complete-screen h1, #dead-screen h1 { font-size: 72px; letter-spacing: 10px; margin: 0; color: #ffd24a; text-shadow: 0 4px 24px #000; }
  #start-screen .tag { font-size: 18px; color: #eee; }
  #start-screen .controls { font-size: 14px; line-height: 1.9; color: #ddd; }
  #start-screen .save-note { font-size: 12px; color: #aaa; }
  button { pointer-events: auto; cursor: pointer; background: #ffd24a; color: #1a1a22; border: none; border-radius: 8px; padding: 12px 34px; font-size: 18px; font-weight: 700; margin-top: 14px; }
  button:hover { background: #ffe27a; }
  #pause-menu h2 { font-size: 40px; letter-spacing: 6px; margin: 0 0 10px; }
  .tabs button { padding: 8px 18px; font-size: 14px; margin: 4px; background: rgba(255, 255, 255, 0.15); color: #fff; }
  .tab { max-height: 560px; overflow: auto; }
  #bigmap { border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 8px; background: #101a14; }
  #mission-list { text-align: left; font-size: 15px; line-height: 2; }
  #mission-list .done { color: #7ee787; }
  #mission-list .current { color: #ffd24a; font-weight: 700; }
  #mission-list .locked { color: #888; }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud" aria-live="polite"></div>
<div id="crosshair">+</div>
<div id="sr-status" class="sr-only" aria-live="polite">Solmar is loading.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
