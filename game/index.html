<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — a 3D open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e1626; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { position: absolute; background: rgba(10, 18, 26, 0.72); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 10px 12px; }
  #mission-box { top: 14px; left: 14px; max-width: 340px; }
  #mission-name { font-weight: 800; font-size: 17px; letter-spacing: 0.5px; }
  #mission-obj { font-size: 13px; color: #dfe9ef; margin-top: 3px; }
  #mission-stage { font-size: 12px; color: #ffd94a; margin-top: 2px; }
  #mission-timer { font-size: 15px; font-weight: 700; color: #ff9a5a; margin-top: 2px; }
  #top-right { top: 14px; right: 14px; text-align: right; min-width: 150px; }
  #clock { font-size: 20px; font-weight: 800; }
  #money { font-size: 18px; font-weight: 700; color: #7ddb8a; }
  #stars { font-size: 20px; letter-spacing: 2px; }
  #rank-box { top: 110px; right: 14px; width: 190px; }
  #rank-title { font-size: 13px; font-weight: 700; }
  #rank-bar, .bar { height: 8px; background: #333; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #rank-fill { height: 100%; background: #ffd94a; width: 0%; }
  #weapons { margin-top: 8px; font-size: 12px; }
  #weapons span { display: inline-block; padding: 2px 5px; margin: 2px 2px 0 0; background: #222; border-radius: 4px; color: #bbb; }
  #weapons span.sel { background: #ffd94a; color: #111; font-weight: 700; }
  #bottom-left { left: 14px; bottom: 14px; width: 190px; }
  #location { font-weight: 800; font-size: 15px; }
  #street { font-size: 12px; color: #cfe8ef; }
  #minimap { margin-top: 8px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; background: #1c2b33; }
  #health-row { margin-top: 8px; }
  #health-fill { height: 100%; background: #4ade80; width: 100%; }
  #armour-fill { height: 100%; background: #4a90d9; width: 0%; }
  .bar.armour { margin-top: 4px; }
  #rep-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: #cfe8ef; }
  .bar.rep { flex: 1; margin-top: 0; }
  #rep-fill { height: 100%; background: #c05ad9; width: 0%; }
  #banner { position: absolute; top: 18%; left: 50%; transform: translate(-50%, -10px); text-align: center; opacity: 0; transition: opacity 0.25s, transform 0.25s; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner-title { font-size: 34px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
  #banner-sub { font-size: 16px; color: #ffe9a8; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
  #act-title { position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 800; letter-spacing: 4px; opacity: 0; transition: opacity 0.5s; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
  #act-title.show { opacity: 1; }
  #crosshair { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 0 4px #000; }
  #damage-flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,0.45) 100%); opacity: 0; transition: opacity 0.15s; }
  #damage-flash.show { opacity: 1; }
  #start-screen, #complete-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,16,26,0.25), rgba(10,16,26,0.78)); pointer-events: auto; }
  .start-inner { text-align: center; max-width: 560px; padding: 30px; }
  .start-inner h1 { font-size: 72px; margin: 0; letter-spacing: 8px; text-shadow: 0 4px 24px rgba(0,0,0,0.9); }
  .start-inner .tag { font-size: 19px; color: #ffe9a8; margin: 8px 0 18px; }
  .start-inner .controls { font-size: 14px; line-height: 1.7; color: #dfe9ef; }
  .start-inner button { pointer-events: auto; font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 12px 42px; margin-top: 18px; border: none; border-radius: 8px; background: #ffd94a; color: #111; cursor: pointer; }
  .start-inner button:hover { background: #ffe066; }
  .save-note { font-size: 12px; color: #9fb3bd; margin-top: 14px; }
  #pause-menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 14, 22, 0.82); pointer-events: auto; }
  .pause-inner { width: 600px; max-width: 94vw; background: #101c26; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 22px; }
  .pause-inner h2 { margin: 0 0 12px; letter-spacing: 4px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { pointer-events: auto; background: #1c2b33; color: #cfe8ef; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
  .tab.active { background: #ffd94a; color: #111; }
  .tab-page { min-height: 200px; }
  #fullmap { max-width: 100%; height: auto; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; }
  #mission-list li { margin: 6px 0; font-size: 14px; }
  #mission-list li.cur { color: #ffd94a; font-weight: 700; }
  #resume-btn, #save-now, #save-clear { pointer-events: auto; background: #ffd94a; color: #111; border: none; border-radius: 6px; padding: 10px 20px; font-weight: 800; cursor: pointer; margin-top: 12px; }
  .hidden { display: none !important; }
  #sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="sr-status" aria-live="polite"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
